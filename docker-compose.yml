version: '3.8'

services:
  go-backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PYTHON_WORKER_URL=http://ai-worker:8000
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - APP_ENV=${APP_ENV:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-http://localhost:8080/auth/github/callback}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-25}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      # Job Map scraping runs inside the Go service, so its keys belong here.
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - FIRECRAWL_MONTHLY_BUDGET=${FIRECRAWL_MONTHLY_BUDGET:-800}
      - JINA_API_KEY=${JINA_API_KEY}
      - PORT=8080
    volumes:
      - ./backend-go:/app
    depends_on:
      - ai-worker

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - EXA_API_KEY=${EXA_API_KEY}
    volumes:
      - ./ai-worker:/app
