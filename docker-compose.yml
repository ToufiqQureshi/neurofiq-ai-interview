version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: neurofiq
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: neurofiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend-go
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=host=db user=neurofiq password=password123 dbname=neurofiq_db port=5432 sslmode=disable
      - FRONTEND_URL=http://localhost:5173
      - AI_GRPC_SERVER=ai-worker:50051
      # Add RESEND_API_KEY, GITHUB_CLIENT_ID, etc in actual prod environment
    depends_on:
      - db

  ai-worker:
    build:
      context: ./ai-worker
    ports:
      - "50051:50051"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80" # Nginx serves on 80 in the container, mapping to 5173 to match local dev port expectations
    depends_on:
      - backend

volumes:
  postgres_data:
